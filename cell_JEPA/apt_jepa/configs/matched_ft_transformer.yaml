data:
  data_dir: data
  metadata_path: data/metadata.csv
  annotation_path: data/cell_annotation.csv
  subtype_col_in_annotation: Celltypes_new
  coarse_mapping_config: cell_JEPA/apt_jepa/configs/coarse_lineage_explicit.yaml
  drop_missing_subtype: true
  drop_unknown: true
  use_quantile_binning: false

split:
  mode: external
  external_split_csv: cell_JEPA/outputs/dropcascade_kfold5_splits/fold0_split.csv

model:
  num_features: 293
  hidden_dim: 256
  n_layers: 4
  n_heads: 8
  ff_dim: 512
  dropout: 0.1

loss:
  variant: flat_ce
  lambda_fine: 1.0
  lambda_coarse: 0.5
  epsilon: 0.000001

schedule:
  calibration_epochs: 5
  calibration_lr: 0.0003

train:
  output_dir: cell_JEPA/outputs/matched_ft_transformer/flat_ce/fold0
  seed: 42
  batch_size: 512
  num_workers: 4
  epochs: 50
  patience: 10
  lr: 0.0001
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  use_amp: true
